title: Stats
fields:
  -
    import: component_settings
  -
    handle: title_heading
    field: title.title
    config:
      display: Title
      width: 100
  -
    handle: text
    field: text.text
  -
    handle: items
    field:
      collapse: true
      previews: true
      fullscreen: true
      max_sets: 4
      sets:
        extra_stat:
          display: 'Extra stat'
          instructions: null
          icon: null
          sets:
            stat:
              display: Stat
              instructions: null
              icon: null
              fields:
                -
                  handle: value
                  field:
                    input_type: text
                    antlers: false
                    type: text
                    display: Value
                    instructions: 'e.g. 94, 75-90%, 1000+'
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    replicator_preview: true
                    hide_display: false
                -
                  handle: label
                  field:
                    input_type: text
                    antlers: false
                    type: text
                    display: Label
                    instructions: 'e.g. Average Lighthouse score'
                    listable: hidden
                    instructions_position: above
                    visibility: visible
                    replicator_preview: true
                    hide_display: false
      type: replicator
      display: Items
      listable: hidden
      instructions_position: above
      visibility: visible
      replicator_preview: true
      hide_display: false
