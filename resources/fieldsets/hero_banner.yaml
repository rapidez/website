title: 'Hero banner'
fields:
  -
    import: component_settings
  -
    handle: variant
    field:
      options:
        default: Default
        simple: Simple
      max_items: 1
      default: default
      type: select
      display: Variant
  -
    handle: heading
    field: title.title
    config:
      display: Heading
      width: 50
  -
    handle: subheading
    field: title.title
    config:
      display: Subheading
      width: 50
  -
    handle: text
    field: text.text
  -
    handle: install_command
    field:
      input_type: text
      antlers: false
      type: text
      display: 'Install command'
      instructions: 'Shown as a copyable command, e.g. curl -fsSL https://rapidez.io/install | bash'
      if:
        variant: 'equals default'
  -
    handle: install_command_text
    field: text.text
    config:
      display: 'Install command text'
      instructions: 'Small text below the install command, e.g. with a link to the /try page'
      if:
        variant: 'equals default'
  -
    handle: buttons
    field:
      max_sets: 2
      type: replicator
      display: Buttons
      if:
        variant: 'equals default'
      sets:
        buttons:
          display: Buttons
          sets:
            button:
              display: Button
              fields:
                -
                  import: button
                -
                  import: button_variant
  -
    handle: youtube_embed_url
    field:
      type: text
      display: 'Youtube embed URL'
      if:
        variant: 'equals default'
  -
    handle: image
    field: image.image
    config:
      display: Image
      instructions: 'Shown on the right when there is no YouTube video'
      if:
        variant: 'equals default'
